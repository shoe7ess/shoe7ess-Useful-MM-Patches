// Procedural Probe Core. Stock CommNet antenna by default; if RemoteTech is installed,
// the section at the bottom swaps it for a RemoteTech SPU + antenna automatically.
// Copied from the Procedural Battery, which already has all five PP shapes
// (Cylinder, Cone, Fillet Cylinder, Smooth Cone, Polygon). Sizes/shapes are unlocked
// by ProceduralPartsFromStart_SizesMM.cfg; they are also unlocked here so the probe
// works even if that file is removed.
+PART[proceduralBattery]:FIRST
{
    @name = proceduralProbeCore
    @title = Procedural Probe Core
    @description = A procedurally scalable probe core. Any shape, any size. Storage capacity adjusts with the size you build it, while antenna power and SAS scale through career tech progression.
    @category = Pods
    @TechRequired = start

    // --- Size: 0.01 m to unlimited, from the start ---
    @MODULE[ProceduralPart]
    {
        @diameterMin = 0.01
        @diameterMax = Infinity
        @lengthMin = 0.01
        @lengthMax = Infinity
        @volumeMin = 0
        @volumeMax = Infinity
        !UPGRADES {}
    }

    // --- Shapes: all unlocked, sensible starting size ---
    @MODULE[ProceduralShape*],*
    {
        %techRequired = start
    }
    @MODULE[ProceduralShapeCylinder]
    {
        @diameter = 1.25
        @length = 0.25
    }

    // --- Electric charge storage, scales with volume ---
    !MODULE[TankContentSwitcher] {}
    MODULE
    {
        name = TankContentSwitcher
        useVolume = True
        TANK_TYPE_OPTION
        {
            name = ElectricCharge
            dryDensity = 0.2
            RESOURCE
            {
                name = ElectricCharge
                unitsPerKL = 20000
            }
        }
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = True
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05
        }
    }

    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 1
        UPGRADES
        {
            UPGRADE
            {
                name__ = ProcProbeClass2
                SASServiceLevel = 2
            }
            UPGRADE
            {
                name__ = ProcProbeClass4
                SASServiceLevel = 3
            }
        }
    }

    !MODULE[ModuleDataTransmitter] {}
    MODULE
    {
        name = ModuleDataTransmitter     // "ModuleProceduralDataTransmitter" doesn't exist
        antennaType = RELAY
        antennaCombinable = True
        antennaPower = 500000
        packetInterval = 0.35
        packetSize = 2
        packetResourceCost = 12.0
        requiredResource = ElectricCharge
        UPGRADES
        {
            UPGRADE
            {
                name__ = ProcProbeClass2
                antennaPower = 2000000
            }
            UPGRADE
            {
                name__ = ProcProbeClass3
                antennaPower = 5000000000
            }
            UPGRADE
            {
                name__ = ProcProbeClass4
                antennaPower = 50000000000
            }
            UPGRADE
            {
                name__ = ProcProbeClass5
                antennaPower = 100000000000
            }
        }
    }
}

// Antenna/SAS classes (sizes are no longer tied to these). All unlocked at start.
PARTUPGRADE
{
    name = ProcProbeClass2
    partIcon = proceduralProbeCore
    techRequired = start
    entryCost = 0
    cost = 0
    title = Procedural Probe Core Upgrade: Class 2
    description = 2M antenna, SAS level 2.
}
PARTUPGRADE
{
    name = ProcProbeClass3
    partIcon = proceduralProbeCore
    techRequired = start
    entryCost = 0
    cost = 0
    title = Procedural Probe Core Upgrade: Class 3
    description = 5G antenna.
}
PARTUPGRADE
{
    name = ProcProbeClass4
    partIcon = proceduralProbeCore
    techRequired = start
    entryCost = 0
    cost = 0
    title = Procedural Probe Core Upgrade: Class 4
    description = 50G antenna, SAS level 3.
}
PARTUPGRADE
{
    name = ProcProbeClass5
    partIcon = proceduralProbeCore
    techRequired = start
    entryCost = 0
    cost = 0
    title = Procedural Probe Core Upgrade: Class 5
    description = 100G antenna.
}


// ============================================================
// REMOTETECH (only applies if RemoteTech is installed)
// Replaces ProcProbeRT.cfg / ProceduralRTProbes.cfg -- delete those.
// Class upgrades use the same ProcProbeClass PARTUPGRADEs above (all unlocked at start).
// ============================================================
@PART[proceduralProbeCore]:NEEDS[RemoteTech]:FINAL
{
    @description = A procedurally scalable probe core. Any shape, any size. Features a built-in RemoteTech Flight Computer (SPU) and an integrated Omni/Dish transceiver that scales with career tech.

    !MODULE[ModuleDataTransmitter],* {}
    !MODULE[ModuleRTAntenna],* {}
    !MODULE[ModuleSPU],* {}

    MODULE
    {
        name = ModuleSPU
        IsRTCommandStation = False
    }

    MODULE
    {
        name = ModuleRTAntenna
        Mode0OmniRange = 0
        Mode1OmniRange = 500000         // Class 1: 500 km
        EnergyCost = 0.02

        TRANSMITTER
        {
            PacketInterval = 0.3
            PacketSize = 2
            PacketResourceCost = 15.0
        }

        UPGRADES
        {
            UPGRADE
            {
                name__ = ProcProbeClass2
                Mode1OmniRange = 2000000        // 2 Mm
                EnergyCost = 0.05
            }
            UPGRADE
            {
                name__ = ProcProbeClass3
                Mode1OmniRange = 0
                Mode1DishRange = 5000000000     // 5 Gm dish
                DishAngle = 25.0
                EnergyCost = 0.10
            }
            UPGRADE
            {
                name__ = ProcProbeClass4
                Mode1DishRange = 50000000000    // 50 Gm
                DishAngle = 10.0
                EnergyCost = 0.18
            }
            UPGRADE
            {
                name__ = ProcProbeClass5
                Mode1DishRange = 100000000000   // 100 Gm
                DishAngle = 5.0
                EnergyCost = 0.25
            }
        }
    }
}
