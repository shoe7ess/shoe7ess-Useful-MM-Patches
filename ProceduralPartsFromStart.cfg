// Unlock every Procedural Parts part at the start node, with every shape available
// and sizes from 0.01 m to unlimited -- no tech-tree upgrades needed.
//
// Why the old version didn't work:
// - ":FOR[ProceduralParts]:FINAL" = two pass specifiers; MM ignored FINAL (log warning).
// - There is no TECHLIMIT node in Procedural Parts 2.x. Size limits are the
//   diameterMin/Max, lengthMin/Max, volumeMin/Max keys plus an UPGRADES block, and
//   each shape is its own MODULE with its own techRequired.

@PART[*]:HAS[@MODULE[ProceduralPart]]:FINAL
{
    @TechRequired = start

    // Size limits: 0.01 to Infinity, and remove the tech-tree size upgrades
    @MODULE[ProceduralPart]
    {
        %diameterMin = 0.01
        %diameterMax = Infinity
        %lengthMin = 0.01
        %lengthMax = Infinity
        %volumeMin = 0
        %volumeMax = Infinity
        !UPGRADES {}
    }

    // Every shape module unlocked at start
    @MODULE[ProceduralShape*],*
    {
        %techRequired = start
    }
}

// Make PP's own upgrade entries start-node too, so nothing shows as "locked" in R&D
@PARTUPGRADE[ProceduralParts*]:FINAL
{
    @techRequired = start
}
