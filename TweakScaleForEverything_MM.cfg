// Larger Scale Factors
@SCALETYPE[free]:NEEDS[TweakScale]:FOR[TweakScale]
{
	%freeScale = true
	%defaultScale = 100
	%suffix = %
	%scaleFactors   = 0.1,    1,   10 , 50 , 100 , 200 , 400 , 1000
	%incrementSlide = 0.01, 0.1, 1 ,  1 ,   2 ,   5 ,  10 ,  10
}

@SCALETYPE[free_square]:NEEDS[TweakScale]:FOR[TweakScale]
{
	%freeScale = true
	%defaultScale = 100
	%suffix = %
	%scaleFactors   = 0.1,    1 , 10 , 50 , 100 , 200 , 400 , 1000
	%incrementSlide = 0.01, 0.1, 1 ,  1 ,   2 ,   5 ,  10 ,  10
	%TWEAKSCALEEXPONENTS
	{
		%mass = 2
	}
}

@SCALETYPE[stack]:NEEDS[TweakScale]:FOR[TweakScale]
{
	%freeScale = true
	%defaultScale = 1.25
	%suffix = m
	%scaleFactors   = 0.1 ,  0.3125 , 0.625 , 0.9375 , 1.25  , 1.875 , 2.5  , 3.75 , 5.0 , 7.5 ,  10 ,   20 , 50
	%incrementSlide = 0.01 , 0.025  , 0.025 , 0.025  , 0.05  , 0.05  , 0.05 , 0.05 , 0.1 , 0.25 , 0.5  , 0.5, 1
}

@SCALETYPE[stack_square]:NEEDS[TweakScale]:FOR[TweakScale]
{
	%freeScale = true
	%defaultScale = 1.25
	%suffix = m
	%scaleFactors   = 0.1 ,  0.3125 , 0.625 , 0.9375 , 1.25  , 1.875 , 2.5  , 3.75 , 5.0 , 7.5  , 10   , 20 , 50
	%incrementSlide = 0.01 , 0.025  , 0.025 , 0.025  , 0.05  , 0.05  , 0.05 , 0.05 , 0.1 , 0.25 , 0.5  , 0.5 , 1
	%TWEAKSCALEEXPONENTS
	{
		%mass = 2
	}
}

@SCALETYPE[surface]:NEEDS[TweakScale]:FOR[TweakScale]
{
	%freeScale = true
	%defaultScale = 1
	%suffix =
	%scaleFactors   = 0.1  , 0.5  , 1   , 2   , 4  , 5  , 10
	%incrementSlide = 0.01 , 0.01 , 0.02, 0.05, 0.1, 0.25, 0.5
}

@PART[*]:HAS[!MODULE[ProceduralPart],!MODULE[RealChuteModule],@MODULE[TweakScale]:HAS[~type[free]]]:FINAL
{
	!MODULE[TweakScale] {}
	%MODULE[TweakScale]
	{
		%type = free
		%freeScale = true
		%defaultScale = 100
		%suffix = %
		%scaleFactors   = 0.1,   10 ,  50 , 100 , 200 , 400 , 1000 , 10000
		%incrementSlide = 0.01, 1 ,  1 ,  2  ,   5 ,   10,   10,   10
	}
}