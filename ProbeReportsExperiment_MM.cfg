// ============================================================
// PROBE REPORTS
// A crew-report-style experiment for uncrewed command parts.
// Worth 1/3 of a Crew Report (stock crewReport: baseValue 5, scienceCap 5).
// ============================================================

EXPERIMENT_DEFINITION
{
    id = probeReport
    title = Probe Report
    baseValue = 1.667          // 1/3 of crewReport's 5
    scienceCap = 1.667
    dataScale = 1
    requireAtmosphere = False
    situationMask = 63         // same situations as Crew Report
    biomeMask = 7              // biome-specific on surface, splashed & flying low (same as Crew Report)

    RESULTS
    {
        default = The probe's onboard sensors log a basic status snapshot of its surroundings.
        default = Telemetry indicates the probe is functioning nominally. Not much else to say.
        default = A routine diagnostic sweep is recorded. The computer seems unimpressed.
        default = Housekeeping data, attitude readings and a temperature log have been stored.

        // --- Stock + OPM solid bodies ---
        MohoSrfLanded = Thermal sensors spike as the probe settles onto scorched rock.
        MohoInSpaceLow = Moho's cratered surface glints in the overwhelming sunlight.
        EveSrfLanded = Pressure sensors are pinned at maximum. The probe isn't going anywhere.
        EveInSpaceLow = The purple world below looks inviting. The probe's fuel estimates disagree.
        GillySrfLanded = Contact detected... probably. The gravity barely registers.
        GillyInSpaceLow = Gilly tumbles past the camera like a lost potato.
        KerbinSrfLanded = The probe reports solid ground and a breathable atmosphere it can't breathe.
        KerbinInSpaceLow = Kerbin fills the camera frame. The probe logs the view without emotion.
        MunSrfLanded = Accelerometers register a gentle settling into Mun dust.
        MunInSpaceLow = Altimeter data shows craters passing below at a steady clip.
        MinmusSrfLanded = Surface contact confirmed. Ground sensors detect an icy, minty-looking crust.
        MinmusInSpaceLow = Minmus's pastel flats reflect sunlight straight into the camera.
        DunaSrfLanded = Fine red dust coats the lens within seconds of touchdown.
        DunaInSpaceLow = Duna's rust-coloured plains slide by beneath the probe.
        IkeSrfLanded = The probe logs grey rock and a looming red neighbour on the horizon.
        IkeInSpaceLow = Ike's dark grey surface absorbs nearly all the camera can throw at it.
        DresSrfLanded = Touchdown on Dres confirmed. The probe flags this as "rarely visited."
        DresInSpaceLow = Dres's canyons appear as dark scars across a dull surface.
        LaytheSrfLanded = Sensors detect an oxygen atmosphere and a lot of water. Promising.
        LaytheInSpaceLow = Laythe's oceans shimmer under Jool's green glow.
        VallSrfLanded = Ice cracks faintly under the landing struts.
        VallInSpaceLow = Vall's frozen surface is streaked with long fractures.
        TyloSrfLanded = Landing complete. The probe's remaining fuel readout is not encouraging.
        TyloInSpaceLow = Tylo's heavy gravity tugs noticeably on the trajectory data.
        BopSrfLanded = The probe settles onto Bop's lumpy surface. Something about it feels watched.
        BopInSpaceLow = Bop's irregular shape rolls slowly through the camera frame.
        PolSrfLanded = Yellowish, pollen-like grains cling to the landing legs.
        PolInSpaceLow = Pol's spiky terrain casts long shadows in the camera feed.
        EelooSrfLanded = Ice and darkness. Temperature sensors bottom out.
        EelooInSpaceLow = Eeloo is a faint, icy speck this far from the Sun.
        HaleSrfLanded = Touchdown on Hale. The rings overhead dominate the sky.
        HaleInSpaceLow = Hale is tiny enough to be mistaken for ring debris.
        OvokSrfLanded = Contact on Ovok's egg-shaped surface confirmed.
        OvokInSpaceLow = Ovok spins lazily, refusing to look round.
        SlateSrfLanded = Slate's grey rock is cold, hard and thoroughly unremarkable.
        SlateInSpaceLow = Slate's heavy gravity well bends the probe's path.
        TektoSrfLanded = A hazy orange atmosphere surrounds the landing site.
        TektoInSpaceLow = Tekto's thick haze hides almost everything below.
        PoltaSrfLanded = The probe lands among Polta's dark, cratered rocks.
        PoltaInSpaceLow = Polta drifts quietly through Urlum's system.
        PriaxSrfLanded = Priax barely holds the probe down.
        PriaxInSpaceLow = Priax is a small grey shard in the camera feed.
        WalSrfLanded = Wal's rough terrain makes for a bumpy landing.
        WalInSpaceLow = Wal's surface shows deep, ancient scars.
        TalSrfLanded = Tal's surface is pale and dusty.
        TalInSpaceLow = Tal hangs close to Wal like a shadow.
        ThatmoSrfLanded = Nitrogen ice crunches under the landing struts.
        ThatmoInSpaceLow = Thatmo's retrograde orbit puzzles the navigation computer.
        NisseeSrfLanded = Nissee is small, cold and very far from home.
        NisseeInSpaceLow = Nissee orbits in Neidon's blue light.
        PlockSrfLanded = Plock's frozen surface is dark and silent.
        PlockInSpaceLow = Plock is barely visible against the stars.
        KarenSrfLanded = Karen's surface is icy and close to Plock.
        KarenInSpaceLow = Karen and Plock wheel around each other in the camera feed.

        // --- Sun and gas giants ---
        SunFlyingLow = Solar panel output is excellent. Thermal readings are concerning.
        SunInSpaceLow = The Sun saturates every optical sensor aboard.
        JoolFlyingLow = The probe is descending into green clouds. This is likely a one-way trip.
        JoolInSpaceLow = Jool's green bands swirl slowly below.
        SarnusFlyingLow = Sarnus's clouds are thick and pale. The probe's hull creaks.
        SarnusInSpaceLow = Sarnus's magnificent rings fill the field of view.
        UrlumFlyingLow = Urlum's cyan atmosphere grows denser with every second.
        UrlumInSpaceLow = Urlum's tilted rings frame the planet nicely.
        NeidonFlyingLow = Neidon's deep blue clouds swallow the probe's lights.
        NeidonInSpaceLow = Neidon is a rich blue disc at the edge of the system.
        KerbinFlyingLow = Barometric sensors confirm the probe is, in fact, flying.
        KerbinInSpaceHigh = Kerbin is a small blue disc in the camera feed.

        // --- Minor Planets Expansion ---
        ArchaeSrfLanded = Surface contact with Archae confirmed. The probe logs soil composition and temperature.
        ArchaeInSpaceLow = Archae passes beneath the probe. Imaging and altimetry data recorded.
        CrokslevSrfLanded = Surface contact with Crokslev confirmed. The probe logs soil composition and temperature.
        CrokslevInSpaceLow = Crokslev passes beneath the probe. Imaging and altimetry data recorded.
        EdasSrfLanded = Surface contact with Edas confirmed. The probe logs soil composition and temperature.
        EdasInSpaceLow = Edas passes beneath the probe. Imaging and altimetry data recorded.
        ErvoSrfLanded = Surface contact with Ervo confirmed. The probe logs soil composition and temperature.
        ErvoInSpaceLow = Ervo passes beneath the probe. Imaging and altimetry data recorded.
        FlakeSrfLanded = Surface contact with Flake confirmed. The probe logs soil composition and temperature.
        FlakeInSpaceLow = Flake passes beneath the probe. Imaging and altimetry data recorded.
        GeitoSrfLanded = Surface contact with Geito confirmed. The probe logs soil composition and temperature.
        GeitoInSpaceLow = Geito passes beneath the probe. Imaging and altimetry data recorded.
        HavousSrfLanded = Surface contact with Havous confirmed. The probe logs soil composition and temperature.
        HavousInSpaceLow = Havous passes beneath the probe. Imaging and altimetry data recorded.
        KalSrfLanded = Surface contact with Kal confirmed. The probe logs soil composition and temperature.
        KalInSpaceLow = Kal passes beneath the probe. Imaging and altimetry data recorded.
        Ki'KiSrfLanded = Surface contact with Ki'Ki confirmed. The probe logs soil composition and temperature.
        Ki'KiInSpaceLow = Ki'Ki passes beneath the probe. Imaging and altimetry data recorded.
        LintMikeySrfLanded = Surface contact with LintMikey confirmed. The probe logs soil composition and temperature.
        LintMikeyInSpaceLow = LintMikey passes beneath the probe. Imaging and altimetry data recorded.
        LonSrfLanded = Surface contact with Lon confirmed. The probe logs soil composition and temperature.
        LonInSpaceLow = Lon passes beneath the probe. Imaging and altimetry data recorded.
        MracksisSrfLanded = Surface contact with Mracksis confirmed. The probe logs soil composition and temperature.
        MracksisInSpaceLow = Mracksis passes beneath the probe. Imaging and altimetry data recorded.
        SodenSrfLanded = Surface contact with Soden confirmed. The probe logs soil composition and temperature.
        SodenInSpaceLow = Soden passes beneath the probe. Imaging and altimetry data recorded.
        VantSrfLanded = Surface contact with Vant confirmed. The probe logs soil composition and temperature.
        VantInSpaceLow = Vant passes beneath the probe. Imaging and altimetry data recorded.
        ZoreSrfLanded = Surface contact with Zore confirmed. The probe logs soil composition and temperature.
        ZoreInSpaceLow = Zore passes beneath the probe. Imaging and altimetry data recorded.
    }
}

// Add Probe Reports to every command part that needs zero crew and has no crew seats.
// :FINAL so it also catches probe cores added by other mods (including proceduralProbeCore).
@PART[*]:HAS[@MODULE[ModuleCommand]:HAS[#minimumCrew[0]],~CrewCapacity[>0],!MODULE[KerbalEVA]]:FINAL
{
    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = probeReport
        experimentActionName = Probe Report
        resetActionName = Discard Probe Report
        reviewActionName = Review Probe Report
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = False
        rerunnable = True
        resettable = True
        resettableOnEVA = False
        dataIsCollectable = True
        collectActionName = Take Probe Data
        interactionRange = 1.5
        xmitDataScalar = 1.0
        usageReqMaskInternal = -1
        usageReqMaskExternal = -1
    }
}
